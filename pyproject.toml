[project]
name = "quatompitch"
version = "1.0.0"
description = "美股辅助交易系统 —— 采集财务数据与重大信息，生成结构化 Markdown 研究报告"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yfinance>=0.2.40",
    "httpx>=0.27",
    "pandas>=2.0",
    "sqlalchemy>=2.0",
    "fredapi>=0.5",
    "feedparser>=6.0",
    "jinja2>=3.1",
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
quatompitch = "quatompitch.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["quatompitch*"]
